{% extends 'base.html' %}

{% block content %}
<div class="card shadow col-lg-7">
  <div class="card-header">{{ titulo }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          {% if field.field.widget.input_type == 'checkbox' %}
            <div class="form-check">{{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
          {% else %}
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
          {% endif %}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{% url 'home:reglas' %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
