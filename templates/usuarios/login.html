<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RPA Comunicaciones Institucionales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>

        body{

            background: linear-gradient(135deg,#0d6efd,#0b3d91);

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;

        }

        .login-card{

            width:430px;

            border:none;

            border-radius:20px;

            overflow:hidden;

            box-shadow:0 15px 40px rgba(0,0,0,.25);

        }

        .login-header{

            background:#0d6efd;

            color:white;

            text-align:center;

            padding:35px;

        }

        .login-header i{

            font-size:60px;

        }

        .login-body{

            background:white;

            padding:35px;

        }

        .form-control{

            height:48px;

            border-radius:10px;

        }

        .btn-login{

            height:48px;

            border-radius:10px;

            font-size:18px;

            font-weight:600;

        }

        .footer{

            text-align:center;

            margin-top:20px;

            color:#777;

            font-size:13px;

        }

        .logo-title{

            font-size:22px;

            font-weight:bold;

        }

        .subtitle{

            font-size:14px;

            opacity:.9;

        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="login-header">

        <i class="bi bi-envelope-paper-fill"></i>

        <div class="logo-title mt-3">

            RPA Comunicaciones

        </div>

        <div class="subtitle">

            Plataforma Inteligente de Gestión Documental

        </div>

    </div>

    <div class="login-body">

        {% if form.errors %}

        <div class="alert alert-danger">

            Usuario o contraseña incorrectos.

        </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Usuario

                </label>

                {{ form.username }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Contraseña

                </label>

                {{ form.password }}

            </div>

            <div class="form-check mb-3">

                <input class="form-check-input"
                       type="checkbox"
                       id="mostrar">

                <label class="form-check-label" for="mostrar">

                    Mostrar contraseña

                </label>

            </div>

            <button class="btn btn-primary w-100 btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Ingresar

            </button>

        </form>

        <div class="footer">

            Universidad Nacional de Colombia<br>

            Sistema Automatizado de Comunicaciones

        </div>

    </div>

</div>

<script>

const check=document.getElementById("mostrar");

const pass=document.getElementById("id_password");

check.addEventListener("change",function(){

    pass.type=this.checked?"text":"password";

});

</script>

</body>

</html>
