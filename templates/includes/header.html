{% load static %}

<header class="m-0">

    <!-- Escudo UNAL -->
    <div class="section-icon">
        <div class="banner-container">

            <a href="https://unal.edu.co/"
               target="_blank"
               rel="noopener"
               class="icon-link">

                <img
                    src="https://gestionapp.medellin.unal.edu.co/cdn/assets/images/logo_unal_circle.png"
                    alt="Universidad Nacional de Colombia">

            </a>

        </div>
    </div>

    <!-- Barra superior -->
    <div id="divider-top"></div>

    <div id="section-menu-middle">

        <div class="padded-container d-flex justify-content-between align-items-center">

            <div>

                <h5 id="name-aplication" class="mb-0">

                    SGDEA

                </h5>

                <small class="text-white">

                    Sistema de Gestión Documental Electrónica de Archivo

                </small>

            </div>

            {% if user.is_authenticated %}

            <div class="dropdown">

                <button
                    class="btn btn-link text-white text-decoration-none dropdown-toggle"
                    data-bs-toggle="dropdown">

                    <i class="bi bi-person-circle"></i>

                    {{ user.get_full_name|default:user.username }}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>

                        <span class="dropdown-item-text">

                            {{ user.username }}

                        </span>

                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>

                        <form method="post"
                              action="{% url 'logout' %}">

                            {% csrf_token %}

                            <button
                                class="dropdown-item"
                                type="submit">

                                <i class="bi bi-box-arrow-right"></i>

                                Cerrar sesión

                            </button>

                        </form>

                    </li>

                </ul>

            </div>

            {% endif %}

        </div>

    </div>

</header>
