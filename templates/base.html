<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RPA Comunicaciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'home:dashboard' %}">
            RPA Comunicaciones
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home:dashboard' %}">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home:entrada' %}">Entrada</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home:salida' %}">Salida</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home:reportes' %}">Reportes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home:reglas' %}">Reglas</a>
                </li>
                <li class="nav-item">
    <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-link nav-link border-0">
            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
    </form>
</li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

{% block content %}
{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
